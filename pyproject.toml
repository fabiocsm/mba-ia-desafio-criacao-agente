[project]
name = "aurora"
version = "0.1.0"
description = "Assistente do Residencial Aurora"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "google-adk==2.2.0",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.32",
]

[project.scripts]
aurora = "aurora.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]
